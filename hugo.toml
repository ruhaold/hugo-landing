baseURL = 'https://ruhaold.github.io/hugo-landing/'
enableRobotsTXT = true
defaultContentLanguage = 'ru'
defaultContentLanguageInSubdir = false

[params]
  catalogPageSize = 6
  phone = '8 800 000-00-00'
  email = 'hello@velora.example'

[taxonomies]
  bodyType = 'body-types'

[languages]
  [languages.ru]
    label = 'RU'
    locale = 'ru-RU'
    weight = 1
    title = 'VELORA — электромобили нового поколения'
    [languages.ru.params]
      description = 'Вымышленный бренд электромобилей. Учебный проект на Hugo.'
    [languages.ru.params.calc]
      digits = 1
      mileage = { min = 5000, max = 50000, step = 1000, value = 15000 }
      tariff = { min = 2, max = 15, step = 0.5, value = 6 }
      fuel = { min = 40, max = 90, step = 1, value = 58 }
      consumption = { min = 5, max = 15, step = 0.5, value = 9 }
    [[languages.ru.menus.main]]
      name = 'Модели'
      pageRef = '/models'
      weight = 10
    [[languages.ru.menus.main]]
      name = 'Сравнение'
      pageRef = '/compare'
      weight = 15
    [[languages.ru.menus.main]]
      name = 'Технологии'
      pageRef = '/'
      params = { anchor = '#tech' }
      weight = 20
    [[languages.ru.menus.main]]
      name = 'Новости'
      pageRef = '/news'
      weight = 30
    [[languages.ru.menus.main]]
      name = 'Тест-драйв'
      pageRef = '/'
      params = { anchor = '#test-drive' }
      weight = 40

  [languages.en]
    label = 'EN'
    locale = 'en-US'
    weight = 2
    title = 'VELORA — next-generation electric cars'
    [languages.en.params]
      description = 'A fictional electric car brand. A Hugo learning project.'
    [languages.en.params.calc]
      digits = 2
      mileage = { min = 5000, max = 50000, step = 1000, value = 15000 }
      tariff = { min = 0.05, max = 0.5, step = 0.01, value = 0.15 }
      fuel = { min = 0.8, max = 2.2, step = 0.05, value = 1.3 }
      consumption = { min = 5, max = 15, step = 0.5, value = 9 }
    [[languages.en.menus.main]]
      name = 'Models'
      pageRef = '/models'
      weight = 10
    [[languages.en.menus.main]]
      name = 'Compare'
      pageRef = '/compare'
      weight = 15
    [[languages.en.menus.main]]
      name = 'Technology'
      pageRef = '/'
      params = { anchor = '#tech' }
      weight = 20
    [[languages.en.menus.main]]
      name = 'News'
      pageRef = '/news'
      weight = 30
    [[languages.en.menus.main]]
      name = 'Test drive'
      pageRef = '/'
      params = { anchor = '#test-drive' }
      weight = 40

# Похожие модели (.Related): совпадение по типу кузова важнее, чем по приводу
[related]
  includeNewer = true
  threshold = 20
  toLower = false
  [[related.indices]]
    name = 'bodyType'
    weight = 100
  [[related.indices]]
    name = 'drive'
    weight = 40
