name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, нужные для публикации в Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется один деплой; более новый заменяет ожидающий
concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Dart Sass (SCSS), Pagefind (поиск)
      - run: npm ci

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build:site -- --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search index
        run: npx pagefind --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
