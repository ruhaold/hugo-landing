{{ define "main" }}
<section class="page-head">
  <div class="container">
    {{ partial "breadcrumbs.html" . }}
    <h1>{{ .Title }}</h1>
    <p class="muted">{{ .Description }}</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <h2 class="sr-only">{{ i18n "news" }}</h2>
    <div class="grid grid--2">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "news-card.html" . }}
    {{ end }}
    </div>
  </div>
</section>
{{ end }}
